# Emulates the read-only behaviour of the public bucket that will serve our data: any-origin
# CORS, byte ranges, ETags, no compression and no directory listings. (A real S3 404 has an XML
# body; clients here only look at the status.)
server {
  listen 9000;
  root /data;
  gzip off; # chunks are compressed by their codec; Content-Encoding conflicts with Range

  location / {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "HEAD, GET" always;
    add_header Access-Control-Allow-Headers "range" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range" always;
    add_header Access-Control-Max-Age 3000 always;
    if ($request_method = OPTIONS) {
      return 204;
    }
    try_files $uri =404;
  }
}
