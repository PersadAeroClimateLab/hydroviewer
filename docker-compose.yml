services:
  # Dev server with hot reload: http://localhost:5173
  web:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "5173:5173"
    environment:
      # Set to true on Docker Desktop (Mac/Windows), where bind mounts deliver no file events.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - .:/app

  # Headless Chromium for inspecting the dev page. Opt-in:
  #   docker compose --profile tools run --rm browser http://web:5173/ --shot home.png
  browser:
    profiles: [tools]
    build:
      context: tools/browser
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    init: true
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ./tools/browser/src:/opt/browser/src:ro
      - ./tools/browser/test:/opt/browser/test:ro
      - ./.shots:/out
