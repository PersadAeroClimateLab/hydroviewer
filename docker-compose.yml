services:
  # Stand-in for the data bucket: serves ./data on http://localhost:9000 with S3-style headers.
  data:
    image: nginx:1.29-alpine
    ports:
      - "9000:9000"
    volumes:
      - ./tools/bucket:/etc/nginx/conf.d:ro
      - ./data:/data:ro

  # Dev server with hot reload: http://localhost:5173
  web:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "5173:5173"
    environment:
      # Set to true on Docker Desktop (Mac/Windows), where bind mounts deliver no file events.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      # Set to e.g. http://localhost:8080 to show the trame viewports in cells C and D.
      VITE_TRAME_URL: ${VITE_TRAME_URL:-}
    volumes:
      - .:/app

  # Headless Chromium for inspecting the dev page. Opt-in:
  #   docker compose --profile tools run --rm browser http://web:5173/ --shot home.png
  browser:
    profiles: [tools]
    build:
      context: tools/browser
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    init: true
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ./tools/browser/src:/opt/browser/src:ro
      - ./tools/browser/test:/opt/browser/test:ro
      - ./.shots:/out

  # Converts source data into our bucket format, into ./data. Opt-in:
  #   docker compose --profile prep run --rm prep CMIP6/CMIP/NOAA-GFDL/GFDL-CM4/historical/r1i1p1f1/Amon/pr/gr1/v20180701
  prep:
    profiles: [prep]
    build:
      context: prep
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ./data:/data

  # trame server: VTK scenes rendered in the browser by vtk.js. Opt-in:
  #   docker compose --profile trame up -d trame     (http://localhost:8080)
  trame:
    profiles: [trame]
    build:
      context: trame
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      DATA_URL: http://data:9000 # server-side fetches use the service name, so no CORS
    volumes:
      - ./trame:/app
      - ./src/assets:/assets:ro
