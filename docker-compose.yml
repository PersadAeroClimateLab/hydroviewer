services:
  # Stand-in for the data bucket: serves $DATA_DIR (default ./data) on http://localhost:9000 with S3-style
  # headers. Switch data with DATA_DIR in .env, then `docker compose up -d data`.
  data:
    image: nginx:1.29-alpine
    ports:
      - "9000:9000"
    volumes:
      - ./tools/bucket:/etc/nginx/conf.d:ro
      - ${DATA_DIR:-./data}:/data:ro

  # Dev server with hot reload: http://localhost:5173
  web:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "5173:5173"
    environment:
      # Set to true on Docker Desktop (Mac/Windows), where bind mounts deliver no file events.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - .:/app

  # Headless Chromium for inspecting the dev page. Opt-in:
  #   docker compose --profile tools run --rm browser http://web:5173/ --shot home.png
  browser:
    profiles: [tools]
    build:
      context: tools/browser
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    init: true
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ./tools/browser/src:/opt/browser/src:ro
      - ./tools/browser/test:/opt/browser/test:ro
      - ./.shots:/out

  # Converts source data into our bucket format, into $DATA_DIR. Opt-in:
  #   docker compose --profile prep run --rm prep CMIP6/CMIP/NOAA-GFDL/GFDL-CM4/historical/r1i1p1f1/Amon/pr/gr1/v20180701
  prep:
    profiles: [prep]
    build:
      context: prep
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ${DATA_DIR:-./data}:/data

  # Writes the mock dataset (catalog.json and mock/annual.zarr) into $DATA_DIR. Mounts prep/, so edits to
  # make_mock.py need no rebuild:  docker compose --profile prep run --rm mock
  mock:
    extends: prep
    entrypoint: ["python", "make_mock.py"]
    volumes:
      - ./prep:/prep:ro


  # The real-data pipeline (docs/llm/PREP_PIPELINE_PLAN.md, prep/pipeline/README.md): cmip6-pds daily pr to the
  # bucket in $DATA_DIR, work files in $WORK_DIR. Mounts prep/, so edits need no rebuild and `select` writes
  # prep/pipeline/runs.json into the repo:  docker compose --profile prep run --rm pipeline all
  pipeline:
    profiles: [prep]
    build:
      context: prep
      dockerfile: pipeline/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    volumes:
      - ./prep:/prep
      - ${DATA_DIR:-./data}:/data
      - ${WORK_DIR:-./work}:/work
